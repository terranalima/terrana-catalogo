<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Categorias | Terrana</title><link rel="icon" href="assets/logo/logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>
.products-toolbar{padding:140px 0 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;}

.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px;padding:24px 0 100px;}
.product-card{display:block;text-decoration:none;color:inherit;border:1px solid #eee;border-radius:6px;overflow:hidden;transition:box-shadow .2s;}

.product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f5f5f5;}
.product-card .badge{position:absolute;margin:10px;padding:4px 10px;background:var(--marron,#6b4a34);color:#fff;font-size:11px;border-radius:3px;}
.product-card-body{padding:14px;}
.product-card-body h4{font-size:15px;margin-bottom:6px;}
.product-card-body .precio{font-weight:600;color:var(--marron,#6b4a34);}
.product-img-wrap{position:relative;}
